<!DOCTYPE html>
<html>
<head>
  <title>Hola Mundo Frontend</title>
</head>
<body>
  <h1>Hola Mundo</h1>
  <p id="mensaje">Cargando...</p>

  <script>
    fetch('http://localhost:3000/mensaje')
      .then(res => res.json())
      .then(data => {
        document.getElementById('mensaje').innerText = data.texto;
      });
  </script>
</body>
</html>
