<!DOCTYPE html>
<html>
<head>
  <title>Hola Mundo Frontend</title>
</head>
<body>
  <h1>Frontend</h1>
  <button onclick="saludar()">Saludar</button>
  <p id="respuesta"></p>

  <script>
    function saludar() {
      fetch("http://localhost:3000/")
        .then(res => res.text())
        .then(data => {
          document.getElementById("respuesta").innerText = data;
        });
    }
  </script>
</body>
</html>
