<!DOCTYPE html>
<html>
<head>
  <title>Hello World Frontend</title>
</head>
<body>
  <h1>Hello World</h1>
  <p id="message">Loading...</p>

  <script>
    fetch('http://localhost:3000/mensaje')
      .then(res => res.json())
      .then(data => {
        document.getElementById('message').innerText = data.message;
      })
      .catch(err => {
        document.getElementById('message').innerText = 'Error connecting to backend';
      });
  </script>
</body>
</html>
